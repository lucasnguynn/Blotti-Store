name: Blotti storefront and investor checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One CI run per PR update, then one verification after merging to main.
# Avoid creating duplicate runs on both branch push and PR synchronization.
concurrency:
  group: blotti-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check investors.js
          node --check checkout.js
      - name: Content, asset and business-model smoke checks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const files = ['index.html','investors.html','policies.html','checkout.html','styles.css','investors.css','policies.css','checkout.css','app.js','investors.js','checkout.js'];
          const texts = Object.fromEntries(files.map(p=>[p,fs.readFileSync(p,'utf8')]));
          const home=texts['index.html'], inv=texts['investors.html'], care=texts['policies.html'];
          for (const id of ['productGrid','fitForm','cartDrawer','wishlistDrawer','modal','journal','siteSearch','proof','story','collections','shop','investorTeaser']) {
            assert(home.includes('id="'+id+'"'), 'Missing storefront element: '+id);
          }
          for(const id of ['thesis','market','strategy','portfolio','metrics','financials','roadmap','team','film','raise','disclosures','sources']) {
            assert(inv.includes('id="'+id+'"'), 'Missing investor section: '+id);
          }
          for(const keyword of ['Signature Fabric','Learning Fit','MISSION','VISION','STANDARDS JOURNEY','Collection preview']){
            assert(home.includes(keyword), 'Missing storefront disclosure: '+keyword);
          }
          for(const keyword of ['Not actual','not actual','Not available','Risk','risk','not a market share forecast','projections']) {
            const plain=inv.toLowerCase();
            assert(plain.includes(keyword.toLowerCase()), 'Missing investor context: '+keyword);
          }
          assert(home.includes('href="investors.html"'),'Storefront investor navigation missing');
          assert(home.includes('href="policies.html#shipping"'),'Shipping policy footer missing');
          assert(home.includes('href="policies.html#returns"'),'Returns footer missing');
          const journal=home.split('id="journal"')[1].split('id="faq"')[0];
          assert(!journal.includes('📏')&&!journal.includes('🧺')&&!journal.includes('🌱'),'Placeholder emoji still used in journal cards');
          assert((home.match(/class="guide-card-media"/g)||[]).length===3,'Journal needs three editorial image cards');
          for(const id of ['shipping','returns','size','care','quality','contact']){
            assert(care.includes('id="'+id+'"'),'Missing policy section '+id);
          }
          assert(care.includes('pre-launch') || care.includes('pre-launch'.toUpperCase()),'Policy status must be disclosed');
          assert(care.includes('not a current Blotti certification'),'Certification status must remain accurate');
          assert(!texts['app.js'].includes("el('#newsletterForm')"),'Obsolete newsletter listener could crash storefront');
          assert(texts['styles.css'].includes('--site-header-offset'),'Sticky header anchor offset missing');
          assert(home.includes('20261031-arrows3') && inv.includes('20261031-arrows3') && care.includes('20261031-arrows3'),'Refined arrow icon assets must use fresh stylesheet/script URLs');
          for(const file of ['index.html','investors.html','policies.html','app.js']){
            assert(!/[\u2197\u2191]/u.test(texts[file]),'iOS emoji-like arrow characters remain in '+file);
            assert(texts[file].includes('class="blotti-arrow-icon'), 'Missing Blotti line arrow SVG in '+file);
          }
          assert(texts['styles.css'].includes('.blotti-arrow-icon{'),'Shared outline arrow style is missing');
          assert(inv.includes('class="inv-flywheel-connector"'),'Investor journey connectors must use stable SVG');
          assert((home.match(/class="blotti-arrow-icon/g)||[]).length>=10,'Storefront arrows were not replaced');
          assert((inv.match(/class="blotti-arrow-icon/g)||[]).length>=20,'Investor arrows were not replaced');
          assert(inv.includes('class="inv-menu-glyph"'),'Investor mobile CSS menu missing');
          const teamNames=['Hồ Quỳnh Như','Nguyễn Đặng Quốc Đạt','Nguyễn Ngọc Thảo An','Lê Hồ Thu Giang','Vương Hồng Châu','Lưu Ngọc Phương Khánh','Trịnh Trần Ngọc Thảo Vy'];
          for(const name of teamNames)assert(inv.includes(name),'Missing team member from source PDF: '+name);
          assert((inv.match(/class="inv-person-card/g)||[]).length===7,'Investor team must contain all seven slide members');
          assert(inv.includes('id="investorFilmPlay"') && inv.includes('assets/team/blotti-team-film-cover.webp'),'Film thumbnail/play interaction missing');
          assert(texts['investors.js'].includes('1brvMZ4LMBH9ObX5ex9AN4tygYYxp3LxK/preview'),'Wrong Google Drive film ID');
          assert(texts['investors.js'].includes('investorFilmPlay'),'Film play button is not wired');
          const portraits=Array.from(inv.matchAll(/src="(assets\/team\/[a-z-]+\.webp)"/g),m=>m[1]);
          assert.equal(portraits.length,8,'Seven portraits and one poster should be present');
          for(const asset of portraits){
            assert(fs.existsSync(asset),'Missing local team asset: '+asset);
            const data=fs.readFileSync(asset);
            assert(data.length>1000 && data.toString('ascii',0,4)==='RIFF' && data.toString('ascii',8,12)==='WEBP','Invalid portrait/cover WebP: '+asset);
          }
          assert(texts['investors.css'].includes('.inv-vision-band:before{content:""'),'iOS emoji pseudo-element not removed');
          for(const file of files){
            const emoji = /[\u2600-\u27bf\u{1f300}-\u{1faff}]/gu;
            assert(!emoji.test(texts[file]),'Potential iOS colored-emoji glyph remains in '+file);
          }
          assert(home.includes('class="hero-star hstar1" aria-hidden="true"></span>'),'Store hero must use CSS decorative shape');
          assert(inv.includes('href="index.html"'),'Return link to storefront missing');
          const checkout=texts['checkout.html'];
          for(const id of ['checkoutDeliveryForm','checkoutItems','checkoutSubtotal','checkoutTotal','checkoutPayAmount','checkoutPayReference','checkoutTransferReported','copyOrderSummary']){
            assert(checkout.includes('id="'+id+'"'),'Checkout missing '+id);
          }
          assert(home.includes('Proceed to checkout')&&texts['app.js'].includes("window.location.assign('checkout.html')"),'Shopping bag checkout route missing');
          assert(checkout.includes('assets/blotti-vietqr-transfer.jpg'),'Uploaded VietQR image missing from checkout');
          const qr=fs.readFileSync('assets/blotti-vietqr-transfer.jpg');
          assert(qr.length>50000 && qr[0]===0xff && qr[1]===0xd8 && qr[2]===0xff,'VietQR JPEG missing/invalid');
          const checkoutJs=texts['checkout.js'];
          assert(checkoutJs.includes('getReference()')&&checkoutJs.includes("data-copy")&&checkoutJs.includes('navigator.clipboard'),'Copyable transfer amount/reference must be implemented');
          assert(checkoutJs.includes('String(subtotal)')&&checkoutJs.includes('Copy unavailable'),'Transfer amount must copy digits with fallback');
          assert(checkoutJs.includes('does not') || checkout.includes('does not transmit'),'Checkout must disclose lack of live payment confirmation');
          assert(checkoutJs.includes('blotti-cart-v1'),'Checkout must read storefront cart');
          assert(checkout.includes('does not transmit orders') && checkout.includes('or verify bank payments'),'Real-money transfer must be disclosed as not auto-verified');
          assert(checkout.includes('does not include the amount') || checkout.includes('does not include the amount or transfer note'),'Static QR must not be represented as prefilled transfer');
          assert(checkout.includes('manual verification'),'Pending state must avoid false verified-payment claims');
          const productMap=[...texts['app.js'].matchAll(/\bid:'([a-z-]+)'[^\n]*?price:(\d+)/g)];
          const checkoutMap=[...checkoutJs.matchAll(/'([a-z-]+)':\{name:'[^']+',price:(\d+)/g)];
          assert(checkoutMap.length>=9,'Checkout needs nine priced items');
          const appPrice=new Map(productMap.map(x=>[x[1],Number(x[2])]));
          for(const m of checkoutMap)assert.equal(Number(m[2]),appPrice.get(m[1]),'Checkout price drift from store: '+m[1]);
          assert(texts['app.js'].includes('renderProducts()'),'Catalog render missing');
          assert(texts['app.js'].includes('localStorage'),'Cart and favorites persistence missing');
          assert(texts['investors.js'].includes('selectFinance('),'Interactive financial chart missing');
          assert(texts['investors.js'].includes('selectYear('),'Interactive roadmap missing');
          assert(texts['styles.css'].includes('@media(max-width:650px)'),'Storefront responsive layout missing');
          assert(texts['investors.css'].includes('@media(max-width:650px)'),'Investor mobile layout missing');
          const refs = new Set(files.flatMap(p=>Array.from(texts[p].matchAll(/assets\/blotti-[a-z-]+\.webp/g),m=>m[0])));
          assert(refs.size>=10,'Too few original Blotti images integrated');
          for(const asset of refs) {
            assert(fs.existsSync(asset),'Referenced product image missing: '+asset);
            const data=fs.readFileSync(asset);
            assert(data.length>500 && data.length<120000,'Unusual asset size: '+asset);
            assert(data.toString('ascii',0,4)==='RIFF' && data.toString('ascii',8,12)==='WEBP','Not a WebP image: '+asset);
          }
          const revenue=[798,1995,3990],costs=[657.2,1759,3169],ebit=[140.8,235.4,820.8];
          for(let i=0;i<3;i++)assert(Math.abs(revenue[i]-costs[i]-ebit[i])<1.0,'Model line-item mismatch beyond rounding');
          const capital=[30000,20000,20000,15000,10000,5000];
          assert.equal(capital.reduce((a,b)=>a+b,0),100000,'Funding allocation must reconcile to USD 100K');
          console.log('Checked '+refs.size+' local Blotti images, investor sections and financial totals.');
          NODE

  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit chromium
      - name: Run local preview server and mobile browser checks
        shell: bash
        run: |
          mkdir -p mobile-captures
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/blotti-preview.log 2>&1 &
          sleep 2
          node tests/mobile-smoke.mjs
      - name: Save iOS-style preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-preview
          path: mobile-captures/
          if-no-files-found: ignore
